spring.application.name=flowscope-mcp

# Default HTTP/SSE port for MCP server (runs on 8081 to avoid conflict with FlowScope Web on 8080)
server.port=${PORT:8081}

# Suppress banner so stdout is pristine for STDIO transport
spring.main.banner-mode=off

# OpenAPI documentation for MCP endpoints
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.flowscope.mcp.controller

# Optional LLM configuration for narrative explanation tools
flowscope.llm.base-url=${LLM_BASE_URL:}
flowscope.llm.api-key=${LLM_API_KEY:}
flowscope.llm.model=${LLM_MODEL:}
flowscope.llm.connect-timeout-ms=5000
flowscope.llm.read-timeout-ms=30000
